[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ahmad-ib-security-research-os"
version = "0.1.0"
description = "AHMAD-IB Hall of Fame research orchestration foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
research-os = "research_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
